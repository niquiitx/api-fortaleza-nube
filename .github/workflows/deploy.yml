name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-audit:
    name: Pruebas de Seguridad y Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Paso 1: Auditoría de dependencias (npm audit)
      - name: Auditoría de vulnerabilidades con npm audit
        run: |
          npm audit --audit-level=high

      # Paso 2: Construir imagen Docker local
      - name: Construir imagen Docker local
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/api-recuperacion:latest .

      # Paso 3: Escaneo con Trivy en busca de CVEs
      - name: Escaneo de Seguridad con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/api-recuperacion:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Paso 4: Iniciar sesión en Docker Hub
      - name: Iniciar sesión en Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Paso 5: Subir imagen a Docker Hub
      - name: Subir imagen a Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/api-recuperacion:latest